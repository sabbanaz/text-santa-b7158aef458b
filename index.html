<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe3f3">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Santa">
<title>Santa Claus</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    color: #111;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(255,255,255,.75), transparent 46%),
      radial-gradient(ellipse at 110% 110%, rgba(255,255,255,.4), transparent 42%),
      #cfe3f3;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    touch-action: manipulation;
  }
  button, input { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .snow {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .flake {
    position: absolute;
    top: -12px;
    border-radius: 50%;
    background: #fff;
    animation: fall linear infinite;
    will-change: transform;
  }
  @keyframes fall {
    0% { transform: translate3d(0, -8vh, 0); }
    100% { transform: translate3d(var(--dx), 110vh, 0); }
  }

  .app {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    background: transparent;
  }

  header {
    position: relative;
    flex: none;
    text-align: center;
    padding: calc(10px + env(safe-area-inset-top)) 52px 10px;
    background: rgba(244, 249, 252, .86);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-bottom: 0.5px solid rgba(40, 70, 100, .12);
  }
  .avatar {
    width: 64px;
    height: 64px;
    margin: 0 auto 6px;
    border-radius: 50%;
    overflow: hidden;
    background: #d7263d;
    box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(40, 70, 100, .18);
  }
  .avatar svg, .av svg, .avatar img, .av img { display: block; width: 100%; height: 100%; object-fit: cover; }
  h1.name {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: #6d6d72;
    font-weight: 500;
  }
  .gear {
    position: absolute;
    right: 4px;
    bottom: 6px;
    width: 44px;
    height: 44px;
    border: 0;
    padding: 0;
    background: transparent;
    color: rgba(60, 60, 67, .55);
    display: grid;
    place-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .gear:active { color: rgba(60, 60, 67, .9); }
  .gear svg { width: 22px; height: 22px; display: block; }

  .thread {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 12px 10px 16px;
  }
  .time {
    text-align: center;
    color: #66788a;
    font-size: 12px;
    font-weight: 600;
    margin: 12px 0 8px;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  .time:first-child { margin-top: 2px; }
  .who-label {
    text-align: right;
    font-size: 11px;
    font-weight: 650;
    color: #5e7388;
    margin: 8px 8px 2px;
    letter-spacing: .01em;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    margin-top: 2px;
    padding: 0 2px;
  }
  .row.kid { justify-content: flex-end; }
  .row.end { margin-bottom: 8px; }
  .hidden { display: none !important; }
  .av {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    flex: none;
    background: #d7263d;
    visibility: hidden;
  }
  .av.show { visibility: visible; }
  .bubble {
    max-width: min(76%, 440px);
    padding: 8px 12px;
    font-size: 16.5px;
    line-height: 1.32;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
    user-select: text;
    -webkit-user-select: text;
  }
  .row.santa .bubble {
    background: #fff;
    color: #111;
    border-radius: 18px;
    border-bottom-left-radius: 18px;
    box-shadow: 0 1px 1.5px rgba(40, 70, 100, .08);
  }
  .row.kid .bubble {
    background: #007aff;
    color: #fff;
    border-radius: 18px;
  }
  .bubble.tail.santa-tail { border-bottom-left-radius: 5px; }
  .bubble.tail.kid-tail { border-bottom-right-radius: 5px; }
  .row.in { animation: rise .22s ease-out; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .typing-label {
    margin: 8px 0 2px 38px;
    font-size: 12px;
    color: #5c7084;
    font-weight: 600;
  }
  .bubble.typing {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 54px;
    min-height: 36px;
  }
  .bubble.typing i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #8e8e93;
    display: block;
    animation: blink 1.2s infinite ease-in-out;
  }
  .bubble.typing i:nth-child(2) { animation-delay: .15s; }
  .bubble.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink {
    0%, 60%, 100% { transform: translateY(0); opacity: .35; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(244, 249, 252, .92);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top: 0.5px solid rgba(40, 70, 100, .12);
  }
  .composer input {
    flex: 1;
    height: 36px;
    border-radius: 18px;
    border: 1px solid rgba(60, 80, 100, .18);
    background: #fff;
    color: #111;
    font-size: 16px;
    padding: 0 14px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .composer input:focus { border-color: rgba(0, 122, 255, .55); }
  .composer input::placeholder { color: #8e8e93; }
  .send {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: #d1d1d6;
    color: #fff;
    display: grid;
    place-items: center;
    flex: none;
    padding: 0;
    cursor: default;
  }
  .send.ready { background: #007aff; cursor: pointer; }
  .send svg { width: 18px; height: 18px; display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(18, 32, 48, .34);
    display: flex;
    justify-content: center;
    padding: 18px 12px;
  }
  .overlay.hidden { display: none; }
  .overlay.center { align-items: center; }
  .overlay.bottom { align-items: flex-end; padding-bottom: 0; }
  .card, .sheet {
    width: min(440px, 100%);
    background: #f2f2f7;
    box-shadow: 0 12px 40px rgba(20, 40, 60, .25);
  }
  .card {
    border-radius: 18px;
    padding: 22px 18px 18px;
  }
  .sheet {
    border-radius: 16px 16px 0 0;
    max-height: min(92dvh, 860px);
    overflow: auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    width: min(520px, 100%);
  }
  .card h2, .sheet h2 {
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .hint {
    margin: 6px 0 16px;
    text-align: center;
    color: #6d6d72;
    font-size: 13px;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 0 0 18px;
    height: 16px;
  }
  .dots b {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid #1c1c1e;
    display: block;
  }
  .dots b.on { background: #1c1c1e; }
  .dots.shake { animation: shake .36s linear; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 14px;
    max-width: 300px;
    margin: 0 auto;
  }
  .key {
    height: 62px;
    border: 0;
    border-radius: 31px;
    background: #fff;
    font-size: 28px;
    font-weight: 500;
    color: #111;
    box-shadow: 0 1px 2px rgba(20, 40, 60, .08);
  }
  .key:active { background: #e5e5ea; }
  .key.ghost { background: transparent; box-shadow: none; font-size: 16px; font-weight: 600; color: #007aff; }
  .cancel {
    display: block;
    margin: 14px auto 0;
    border: 0;
    background: transparent;
    color: #007aff;
    font-size: 16px;
    font-weight: 600;
    padding: 8px 16px;
  }

  .sheet-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: -12px;
    background: #f2f2f7;
    padding: 6px 0 8px;
    z-index: 1;
  }
  .sheet-top h2 { flex: 1; }
  .done {
    border: 0;
    background: transparent;
    color: #007aff;
    font-size: 17px;
    font-weight: 600;
    padding: 6px;
    min-width: 56px;
    text-align: right;
  }
  .sheet-top .spacer { min-width: 56px; }
  .kid-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px 14px 12px;
    margin: 10px 0;
    box-shadow: 0 1px 2px rgba(20, 40, 60, .05);
  }
  .kid-card h3 {
    margin: 0 0 8px;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .kid-card .empty {
    margin: 0;
    color: #8e8e93;
    font-size: 15px;
  }
  .k {
    margin: 8px 0 2px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #8e8e93;
  }
  .v { margin: 0; font-size: 16px; line-height: 1.35; }
  .wishes { margin: 4px 0 0; padding: 0 0 0 18px; }
  .wishes li { margin: 3px 0; font-size: 16px; }
  .note {
    color: #6d6d72;
    font-size: 13px;
    line-height: 1.4;
    margin: 4px 2px 12px;
  }
  .clear {
    width: 100%;
    border: 0;
    background: #fff;
    color: #ff3b30;
    font-size: 17px;
    font-weight: 600;
    border-radius: 14px;
    padding: 14px;
    margin-top: 4px;
  }
  .confirm {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    margin-top: 4px;
    text-align: center;
  }
  .confirm p { margin: 0 0 10px; font-size: 15px; }
  .confirm-row { display: flex; gap: 10px; }
  .confirm-row button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    font-weight: 650;
  }
  .confirm-row .yes { background: #ff3b30; color: #fff; }
  .confirm-row .no { background: #e5e5ea; color: #111; }

  .noscript {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    background: #e7f2fa;
  }
  .noscript p { max-width: 320px; font-size: 17px; line-height: 1.4; }

  @media (prefers-reduced-motion: reduce) {
    .flake, .row.in, .bubble.typing i, .dots.shake { animation: none; }
  }
</style>
</head>

<script>
(function () {
  var KEY = "text-santa-v1";
  var FAST = typeof location !== "undefined" && /(?:\?|&)fast=1(?:&|$)/.test(location.search);
  var REDUCE = typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var CODE = "1225";
  var PHASES = ["ask_name", "naughty", "nice_thing", "wishes", "more_wishes", "reindeer", "cookies", "done"];
  var REINDEER = ["dasher", "dancer", "prancer", "vixen", "comet", "cupid", "donner", "blitzen", "rudolph"];

  function freshState() {
    return {
      messages: [],
      phase: "ask_name",
      speaker: null,
      kids: {
        oliver: blankKid(),
        ava: blankKid(),
        both: blankKid()
      },
      cursors: {},
      lastLine: "",
      echoCursor: 0,
      jokeCursor: 0
    };
  }

  function blankKid() {
    return { verdict: null, niceThing: null, wishes: [] };
  }

  function normalize(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[’‘]/g, "'")
      .replace(/'/g, "")
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function damerau(a, b) {
    if (a === b) return 0;
    var al = a.length, bl = b.length;
    if (!al) return bl;
    if (!bl) return al;
    var dp = [];
    for (var i = 0; i <= al; i++) {
      dp[i] = [i];
    }
    for (var j = 1; j <= bl; j++) dp[0][j] = j;
    for (i = 1; i <= al; i++) {
      for (j = 1; j <= bl; j++) {
        var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        var v = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        if (i > 1 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
          v = Math.min(v, dp[i - 2][j - 2] + 1);
        }
        dp[i][j] = v;
      }
    }
    return dp[al][bl];
  }

  function windowClose(squashed, target, maxDist) {
    var minL = target.length - 1;
    var maxL = target.length + 1;
    if (minL < 3) minL = 3;
    for (var len = minL; len <= maxL; len++) {
      for (var i = 0; i + len <= squashed.length; i++) {
        if (damerau(squashed.slice(i, i + len), target) <= maxDist) return true;
      }
    }
    return false;
  }

  function wordMatchesOliver(w) {
    if (w === "oliver" || w === "ollie" || w === "olly" || w === "oli") return true;
    if (w.length < 5 || w.length > 9) return false;
    return damerau(w, "oliver") <= 2;
  }

  function wordMatchesAva(w) {
    if (w === "ava") return true;
    if (w.length < 3 || w.length > 5) return false;
    var ban = { and: 1, are: 1, dad: 1, the: 1, was: 1, has: 1, her: 1, she: 1, you: 1, for: 1, not: 1, but: 1, can: 1, how: 1, old: 1, mom: 1, ava: 0 };
    if (ban[w]) return false;
    return damerau(w, "ava") <= 1;
  }

  function detectWho(raw) {
    var text = normalize(raw);
    if (!text) return null;
    var words = text.split(" ").filter(Boolean);
    var squ = words.join("");
    var oliver = false;
    var ava = false;
    var i;
    for (i = 0; i < words.length; i++) {
      if (wordMatchesOliver(words[i])) oliver = true;
      if (wordMatchesAva(words[i])) ava = true;
    }
    if (!oliver && /oliver|ollie|olly/.test(squ)) oliver = true;
    if (!oliver && squ.length <= 28 && windowClose(squ, "oliver", 1)) oliver = true;
    if (!ava && text.length < 48 && /ava/.test(squ) && !/available|avalanche|avatar|avant/.test(squ)) ava = true;
    if (/olivers sister|olivers sis/.test(squ) && !/\bava\b/.test(text)) return "ava";
    if (/avas brother|avas bro/.test(squ) && !oliver) return "oliver";
    var bothPhrase = /\b(both of us|both|together|the two of us|two of us|we both|us both)\b/.test(text);
    if (oliver && ava) return "both";
    if (bothPhrase) return "both";
    if (oliver) return "oliver";
    if (ava) return "ava";
    return null;
  }

  function hasFuzzy(text, target, maxDist) {
    var words = text.split(" ");
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (Math.abs(w.length - target.length) > maxDist) continue;
      if (damerau(w, target) <= maxDist) return true;
    }
    return false;
  }

  function detectVerdict(raw) {
    var t = normalize(raw);
    if (!t) return null;
    if (/^(good night|goodnight)$/.test(t)) return null;
    if (/\bnot bad\b/.test(t) && !/\bnaughty\b/.test(t)) return "nice";
    var little = /\b(a little|a bit|kinda|kind of|sort of|somewhat|a tad|little bit)\b/.test(t);
    var naughty = hasFuzzy(t, "naughty", 2) || /\b(nauty|naughy|noghty)\b/.test(t) || /\b(bad|trouble|mischief)\b/.test(t);
    var nice = hasFuzzy(t, "nice", 1) || /\b(good|well behaved|wellbehaved)\b/.test(t);
    var mixedPhrase = /\b(half and half|in the middle|so so|naughty and nice|nice and naughty|a little of both|bit of both|kind of both|i was both)\b/.test(t)
      || /^both$/.test(t);
    if (/\bnot nice\b/.test(t) && !nice) return "naughty";
    if ((little && naughty) || (naughty && nice) || mixedPhrase) return "mixed";
    if (/\bmostly naughty\b/.test(t)) return "mixed";
    if (naughty) return "naughty";
    if (nice || /\bmostly nice\b/.test(t)) return "nice";
    if (/\b(i|we)\s+(helped|shared|cleaned|hugged|gave|listened|made|let)\b/.test(t)) return "nice";
    if (/\b(helped|shared with|cleaned my|cleaned our|was kind|were kind)\b/.test(t)) return "nice";
    return null;
  }

  function extractNiceThing(raw) {

        : "The elves just pulled up another chair. It's a happy crowd now.";
    var ask = who === "both"
      ? "Have you two been naughty or nice this year? Tell me honestly, and one nice thing you did."
      : "Tell me honestly, " + name + ". Have you been naughty or nice this year? And what's one nice thing you did?";
    return [name + "! I wondered when you'd take a turn.", mid, ask];
  }

  function wishQuestion() {
    return "What would you like for Christmas?";
  }

  function echoWish(state, item) {
    var pretty = cap(item);
    var lines = [
      pretty + "! I'll pass that straight to the workshop.",
      "Ho ho! " + pretty + ". The elves just perked up.",
      pretty + "! Written in the big book, in my best handwriting.",
      pretty + "! Mrs. Claus says that is a fine wish. 🎄"
    ];
    var line = lines[state.echoCursor % lines.length];
    state.echoCursor = (state.echoCursor + 1) % lines.length;
    return line;
  }

  function reindeerReply(names) {
    if (!names || !names.length) {
      return "They'll all claim you said their name. Rudolph is already glowing about it.";
    }
    if (names[0] === "all" || names.length >= 4) {
      return "All of them? The stable just got very proud and very loud. 🦌";
    }
    var lines = {
      rudolph: "Rudolph! He's in the barn pretending not to hear, and his nose just gave him away.",
      dasher: "Dasher! He's the one who always wants to leave five minutes early. A fine choice.",
      dancer: "Dancer! She practices twirls in the snow when she thinks nobody is looking.",
      prancer: "Prancer! High knees, every time, even on the way to breakfast.",
      vixen: "Vixen! Clever as a spark, and she knows it.",
      comet: "Comet! Fastest start in the stable. Hold onto your hat.",
      cupid: "Cupid! A soft heart and a very steady trot. Mrs. Claus approves.",
      donner: "Donner! Steady and strong. I trust him on the windy nights.",
      blitzen: "Blitzen! Quick as a flash, and first to the carrot bucket."
    };
    if (names.length === 1) return lines[names[0]];
    var nice = names.slice(0, 3).map(function (n) { return cap(n); });
    return nice.join(" and ") + "! I'll tell them. Try not to start a contest in the barn.";
  }

  function detectHandoff(state, raw) {
    var t = normalize(raw);
    var who = detectWho(raw);
    if (!who) {
      if (state.speaker === "oliver" && /\b(my sister|sister)\b/.test(t) && t.split(" ").length <= 6) return "ava";
      if (state.speaker === "ava" && /\b(my brother|brother)\b/.test(t) && t.split(" ").length <= 6) return "oliver";
      return null;
    }
    if (who === state.speaker) return null;
    var cue = /\b(now|its|turn|next|here|im|i am|this is|hello|hi|hey|me|switch|other|shes|hes|her|his)\b/.test(t);
    if (cue || t.split(" ").length <= 5) return who;
    return null;
  }

  function applyPhase(state, raw) {
    var text = String(raw || "").trim();
    var t = normalize(text);
    if (state.phase === "ask_name") {
      var who = detectWho(text);
      if (!who) return null;
      state.speaker = who;
      state.phase = "naughty";
      return helloLines(who);
    }
    if (state.phase === "naughty") {
      var verdict = detectVerdict(text);
      var thing = extractNiceThing(text);
      if (!verdict && !thing) return null;
      var v = verdict || "nice";
      profile(state).verdict = v;
      var name = kidName(state.speaker);
      if (thing) {
        profile(state).niceThing = cap(clip(thing, 200));
        state.phase = "wishes";
        if (v === "nice") {
          return [
            "I had a feeling, " + name + ".",
            quoteThing(thing) + " That's wonderful. That's exactly why you're on the nice list.",
            wishQuestion()
          ];
        }
        if (v === "naughty") {
          return [
            "Thank you for being honest, " + name + ". That was brave.",
            quoteThing(thing) + " That still counts, very much. " + kindness(state.speaker) + " You're headed for the nice list.",
            wishQuestion()
          ];
        }
        return [
          "A little naughty, and honest about it. I like that, " + name + ".",
          quoteThing(thing) + " That's a real nice-list moment. " + kindness(state.speaker) + " You're headed for the nice list.",
          wishQuestion()
        ];
      }
      state.phase = "nice_thing";
      if (v === "nice") {
        return ["I had a feeling, " + name + ". The nice list already has a bright little star by your name. What's one nice thing you did this year?"];
      }
      if (v === "naughty") {
        return [
          "Thank you for being honest, " + name + ". That was brave.",
          kindness(state.speaker) + " What's one nice thing you did, even a small one?"
        ];
      }
      return [
        "A little naughty, and honest about it. I like that, " + name + ". Everyone has a day that goes sideways.",
        kindness(state.speaker) + " Tell me one nice thing you did this year."
      ];
    }
    if (state.phase === "nice_thing") {
      var pv = profile(state).verdict || "nice";
      var nm = kidName(state.speaker);
      if (isUnsure(text)) {
        profile(state).niceThing = "";
        state.phase = "wishes";
        var listLine = pv === "nice"
          ? "That's all right. Being honest counts. You're on the nice list, " + nm + "."
          : "That's all right. Being honest counts. You're headed for the nice list, " + nm + ". I believe it.";
        return [listLine, wishQuestion()];
      }
      profile(state).niceThing = cap(clip(text, 200));
      state.phase = "wishes";
      if (pv === "nice") {
        return [quoteThing(text) + " I'll remember that. You're on the nice list, " + nm + ".", wishQuestion()];
      }
      return [quoteThing(text) + " You see? That's why you're headed for the nice list, " + nm + ".", wishQuestion()];
    }
    if (state.phase === "wishes" || state.phase === "more_wishes") {
      if (isWishDecline(text)) {
        var mine = profile(state).wishes.length;
        if (state.speaker === "both") mine += state.kids.oliver.wishes.length + state.kids.ava.wishes.length;
        state.phase = "reindeer";
        if (!mine) {
          return [
            "No wishes at all? That's all right. Surprises are a North Pole specialty.",
            "One more thing from the stable. Which reindeer is your favorite?"
          ];
        }
        return [
          "The list is tucked in my coat pocket.",
          "One more thing from the stable. Which reindeer is your favorite?"
        ];
      }
      var items = parseWishes(text);
      if (!items.length) return null;
      addWishes(state, items);
      state.phase = "more_wishes";
      var bits = items.map(function (item) { return echoWish(state, item); });
      return [bits.join(" "), "Anything else?"];
    }
    if (state.phase === "reindeer") {
      state.phase = "cookies";
      return [
        reindeerReply(detectReindeer(text)),
        "And on Christmas Eve, will you leave cookies and milk? The reindeer asked me to mention carrots, too. 🍪"
      ];
    }
    if (state.phase === "cookies") {
      var yn = detectYesNo(text);
      state.phase = "done";
      var cookieLine = yn === "no"
        ? "That's perfectly fine. A kind thought is a feast up here."
        : yn === "yes"
          ? "Wonderful. I'll save room, which is harder than it sounds."
          : "Either way, thank you. The reindeer mostly care that you're sleeping soundly.";
      var bed = (state.speaker === "both"
        ? "Be kind to each other, and kind at home, all the way to Christmas."
        : state.speaker === "oliver"
          ? "Be kind to Ava, and kind at home, all the way to Christmas."
          : "Be kind to Oliver, and kind at home, all the way to Christmas.")
        + " On Christmas Eve, crawl into bed and close your eyes. That's when the sleigh bells work best.";
      return [
        cookieLine,
        bed,
        "I'll do my very best, and the elves are already busy! Merry Christmas, " + kidName(state.speaker) + ". Ho ho ho! 🎅"
      ];
    }
    if (state.phase === "done") {
      var next = detectHandoff(state, text);
      if (next) {
        state.speaker = next;
        state.phase = "naughty";
        if (next !== "both") {
          state.kids[next].verdict = null;
          state.kids[next].niceThing = null;
        } else {
          state.kids.both.verdict = null;
          state.kids.both.niceThing = null;
        }
        return handoffLines(next);
      }
      if (/\b(add|another wish|one more thing|i also want|i forgot|can i add)\b/.test(t)) {
        var more = parseWishes(text);
        if (more.length) {
          addWishes(state, more);
          state.phase = "more_wishes";
          return [more.map(function (item) { return echoWish(state, item); }).join(" "), "Anything else?"];
        }
        state.phase = "more_wishes";
        return ["Of course. What else should I write down?"];
      }
      return null;
    }
    return null;
  }

  function replyLines(state, raw) {
    var safe = safetyReply(raw);
    if (safe) return [safe, nudge(state)];
    var side = matchSide(state, raw);
    if (side) return [side, nudge(state)];
    var phase = applyPhase(state, raw);
    if (phase && phase.length) return phase;
    return [fallback(state)];
  }

  function reduce(state, raw) {
    var text = String(raw || "").trim();
    if (!text) return state;
    var lines = replyLines(state, text);
    state.messages.push({
      role: "kid",
      text: text.slice(0, 500),
      ts: Date.now(),
      who: state.speaker
    });
    for (var i = 0; i < lines.length; i++) {
      state.messages.push({ role: "santa", text: lines[i], ts: Date.now() + i + 1 });
    }
    return state;
  }

  function sanitize(data) {
    if (!data || typeof data !== "object") return null;
    var base = freshState();
    base.phase = PHASES.indexOf(data.phase) >= 0 ? data.phase : "ask_name";
    base.speaker = data.speaker === "oliver" || data.speaker === "ava" || data.speaker === "both" ? data.speaker : null;
    ["oliver", "ava", "both"].forEach(function (k) {
      var src = data.kids && data.kids[k] ? data.kids[k] : {};
      base.kids[k] = {
        verdict: src.verdict === "nice" || src.verdict === "naughty" || src.verdict === "mixed" ? src.verdict : null,
        niceThing: typeof src.niceThing === "string" ? src.niceThing.slice(0, 240) : null,
        wishes: Array.isArray(src.wishes) ? src.wishes.filter(function (w) { return typeof w === "string"; }).slice(0, 24) : []
      };
    });
    base.messages = Array.isArray(data.messages) ? data.messages.filter(function (m) {
      return m && (m.role === "santa" || m.role === "kid") && typeof m.text === "string";
    }).map(function (m) {
      return {
        role: m.role,
        text: m.text.slice(0, 500),
        ts: typeof m.ts === "number" ? m.ts : Date.now(),
        who: m.who === "oliver" || m.who === "ava" || m.who === "both" ? m.who : null
      };
    }) : [];
    base.cursors = data.cursors && typeof data.cursors === "object" ? data.cursors : {};
    base.lastLine = typeof data.lastLine === "string" ? data.lastLine : "";
    base.echoCursor = typeof data.echoCursor === "number" ? data.echoCursor : 0;
    base.jokeCursor = typeof data.jokeCursor === "number" ? data.jokeCursor : 0;
    if (!base.messages.length) return null;
    return base;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return sanitize(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) { /* private mode or full storage: the chat still works */ }
  }

  var state = freshState();
  var thread = document.getElementById("thread");
  var draft = document.getElementById("draft");
  var sendBtn = document.getElementById("send");
  var composer = document.getElementById("composer");
  var avatarHTML = document.getElementById("avatar").innerHTML;
  var queue = [];
  var pumping = false;
  var playId = 0;
  var ready = false;
  var codeBuf = "";
  var lastKidWho = null;

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function makeAvatar() {
    var d = document.createElement("div");
    d.className = "av";
    d.innerHTML = avatarHTML;
    return d;
  }

  function formatStamp(ts) {
    var d = new Date(ts);
    var now = new Date();
    var time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    var same = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    if (same) return "Today " + time;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + time;
  }

  function whoLabel(who) {
    if (who === "oliver") return "Oliver";
    if (who === "ava") return "Ava";
    if (who === "both") return "Oliver & Ava";
    return "";
  }

  function refreshTails() {
    var rows = thread.querySelectorAll(".row");
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var next = rows[i + 1];
      var role = row.getAttribute("data-role");
      var last = !next || next.getAttribute("data-role") !== role;
      var bubble = row.querySelector(".bubble");
      if (!bubble.classList.contains("typing")) {
        bubble.classList.toggle("tail", last);
        bubble.classList.toggle(role === "santa" ? "santa-tail" : "kid-tail", last);
      }
      var av = row.querySelector(".av");
      if (av) av.classList.toggle("show", last);
      if (last && next) row.classList.add("end");
    }
  }

  function appendMessage(msg, animate) {
    var prev = state.messages.filter(function (m) { return m._shown; }).pop();
    // Timestamps use the messages already on screen.
    var shown = thread.querySelectorAll(".row");
    var prevShownTs = shown.length ? Number(shown[shown.length - 1].getAttribute("data-ts")) : 0;
    if (!prevShownTs || msg.ts - prevShownTs > 5 * 60 * 1000) {
      var time = document.createElement("div");
      time.className = "time";
      time.textContent = formatStamp(msg.ts);
      thread.appendChild(time);
    }
    if (msg.role === "kid" && msg.who && msg.who !== lastKidWho) {
      var lab = document.createElement("div");
      lab.className = "who-label";
      lab.textContent = whoLabel(msg.who);
      thread.appendChild(lab);
      lastKidWho = msg.who;
    }
    var row = document.createElement("div");
    row.className = "row " + (msg.role === "kid" ? "kid" : "santa") + (animate ? " in" : "");
    row.setAttribute("data-role", msg.role);
    row.setAttribute("data-ts", String(msg.ts));
    if (msg.role === "santa") row.appendChild(makeAvatar());
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = msg.text;
    row.appendChild(bubble);
    thread.appendChild(row);
    msg._shown = true;
    refreshTails();
    thread.scrollTop = thread.scrollHeight;
  }

  function renderAll() {
    thread.innerHTML = "";
    lastKidWho = null;
    state.messages.forEach(function (m) { m._shown = false; });
    state.messages.forEach(function (m) { appendMessage(m, false); });
  }

  function showTyping() {
    hideTyping();
    var label = document.createElement("div");
    label.className = "typing-label";
    label.id = "typing-label";
    label.textContent = "Santa is typing…";
    var row = document.createElement("div");
    row.className = "row santa";
    row.id = "typing-row";
    var av = makeAvatar();
    av.classList.add("show");
    row.appendChild(av);
    var bubble = document.createElement("div");
    bubble.className = "bubble tail santa-tail typing";
    bubble.innerHTML = "<i></i><i></i><i></i>";
    row.appendChild(bubble);
    thread.appendChild(label);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function hideTyping() {
    var a = document.getElementById("typing-label");
    var b = document.getElementById("typing-row");
    if (a) a.remove();
    if (b) b.remove();
  }

  function syncSend() {
    var has = draft.value.trim().length > 0;
    sendBtn.disabled = !has;
    sendBtn.classList.toggle("ready", has);
  }

  async function revealSanta(messages, id) {
    for (var i = 0; i < messages.length; i++) {
      if (id !== playId) return;
      showTyping();
      await wait(typingDelay(messages[i].text));
      if (id !== playId) return;
      hideTyping();
      appendMessage(messages[i], true);
    }
  }

  async function runTurn(text, id) {
    if (id !== playId) return;
    var before = state.messages.length;
    reduce(state, text);
    save();
    if (id !== playId) return;
    var added = state.messages.slice(before);
    if (!added.length) return;
    appendMessage(added[0], true);
    await revealSanta(added.slice(1), id);
  }

  async function pump() {
    if (pumping || !ready) return;
    pumping = true;
    var id = playId;
    while (queue.length && id === playId) {
      var text = queue.shift();
      await runTurn(text, id);
    }
    pumping = false;
    if (queue.length && id === playId) pump();
  }

  function enqueue(text) {
    queue.push(text);
    if (ready && !pumping) pump();
  }

  function stopAll() {
    playId++;
    queue.length = 0;
    pumping = false;
    hideTyping();
  }

  async function playGreeting() {
    var text = "Ho ho ho! Who's texting me tonight?";
    var msg = { role: "santa", text: text, ts: Date.now() };
    state.messages.push(msg);
    save();
    var id = playId;
    pumping = true;
    await revealSanta([msg], id);
    if (id !== playId) return;
    pumping = false;
    ready = true;
    if (queue.length) pump();
  }

  function boot() {
    var saved = loadState();
    if (saved) {
      state = saved;
      renderAll();
      ready = true;
      return;
    }
    state = freshState();
    playGreeting();
  }

  function verdictLabel(v) {
    if (v === "nice") return "Nice";
    if (v === "naughty") return "Naughty";
    if (v === "mixed") return "A little naughty";
    return "Not yet";
  }

  function kidHas(k) {
    return !!(k && (k.verdict || k.niceThing || (k.wishes && k.wishes.length)));
  }

  function fillCard(parent, title, kid) {
    var card = document.createElement("section");
    card.className = "kid-card";
    var h = document.createElement("h3");
    h.textContent = title;
    card.appendChild(h);
    if (!kidHas(kid)) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Hasn't told Santa yet.";
      card.appendChild(empty);
      parent.appendChild(card);
      return;
    }
    var k1 = document.createElement("div");
    k1.className = "k";
    k1.textContent = "Naughty or nice";
    var v1 = document.createElement("p");
    v1.className = "v";
    v1.textContent = verdictLabel(kid.verdict);
    var k2 = document.createElement("div");
    k2.className = "k";
    k2.textContent = "A nice thing they shared";
    var v2 = document.createElement("p");
    v2.className = "v";
    v2.textContent = kid.niceThing ? cap(kid.niceThing) : "—";
    var k3 = document.createElement("div");
    k3.className = "k";
    k3.textContent = "Wish list";
    card.appendChild(k1);
    card.appendChild(v1);
    card.appendChild(k2);
    card.appendChild(v2);
    card.appendChild(k3);
    if (!kid.wishes || !kid.wishes.length) {
      var none = document.createElement("p");
      none.className = "v";
      none.textContent = "No wishes yet";
      card.appendChild(none);
    } else {
      var ul = document.createElement("ul");
      ul.className = "wishes";
      kid.wishes.forEach(function (w) {
        var li = document.createElement("li");
        li.textContent = cap(w);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    parent.appendChild(card);
  }

  function renderParent() {
    var body = document.getElementById("parent-body");
    body.innerHTML = "";
    fillCard(body, "Oliver", state.kids.oliver);
    fillCard(body, "Ava", state.kids.ava);
    if (kidHas(state.kids.both)) fillCard(body, "Oliver & Ava together", state.kids.both);
  }

  function openParent() {
    closePasscode();
    renderParent();
    document.getElementById("confirm").classList.add("hidden");
    document.getElementById("clear-btn").classList.remove("hidden");
    document.getElementById("parent").classList.remove("hidden");
  }

  function closeParent() {
    document.getElementById("parent").classList.add("hidden");
  }

  function openPasscode() {
    codeBuf = "";
    paintDots();
    document.getElementById("passcode").classList.remove("hidden");
  }

  function closePasscode() {
    document.getElementById("passcode").classList.add("hidden");
    codeBuf = "";
    paintDots();
  }

  function paintDots() {
    var dots = document.querySelectorAll("#dots b");
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < codeBuf.length);
  }

  function enterDigit(d) {
    if (codeBuf.length >= 4) return;
    codeBuf += d;
    paintDots();
    if (codeBuf.length === 4) {
      if (codeBuf === CODE) {
        closePasscode();
        openParent();
      } else {
        var box = document.getElementById("dots");
        box.classList.remove("shake");
        void box.offsetWidth;
        box.classList.add("shake");
        setTimeout(function () {
          codeBuf = "";
          paintDots();
        }, 280);
      }
    }
  }

  function clearConversation() {
    stopAll();
    ready = false;
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = freshState();
    thread.innerHTML = "";
    lastKidWho = null;
    closeParent();
    playGreeting();
  }

  function makeSnow() {
    var root = document.getElementById("snow");
    var count = 26;
    for (var i = 0; i < count; i++) {
      var f = document.createElement("span");
      f.className = "flake";
      var size = 2 + (i % 5) * 1.15;
      f.style.width = size + "px";
      f.style.height = size + "px";
      f.style.left = ((i * 37) % 100) + "%";
      f.style.opacity = String(0.35 + (i % 4) * 0.12);
      var dur = 12 + (i % 7) * 2.4;
      f.style.animationDuration = dur + "s";
      f.style.animationDelay = (-(i * 1.7)) + "s";
      f.style.setProperty("--dx", ((i % 2 === 0 ? -1 : 1) * (12 + (i % 5) * 8)) + "px");
      root.appendChild(f);
    }
  }

  draft.addEventListener("input", syncSend);
  composer.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = draft.value.trim();
    if (!text) return;
    draft.value = "";
    syncSend();
    enqueue(text);
  });

  var gear = document.getElementById("gear");
  var holdTimer = null;
  var didLong = false;
  gear.addEventListener("pointerdown", function () {
    didLong = false;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function () {
      didLong = true;
      openParent();
    }, 550);
  });
  function endHold() { clearTimeout(holdTimer); }
  gear.addEventListener("pointerup", endHold);
  gear.addEventListener("pointerleave", endHold);
  gear.addEventListener("pointercancel", endHold);
  gear.addEventListener("click", function () {
    if (didLong) { didLong = false; return; }
    openPasscode();
  });
  gear.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    didLong = true;
    openParent();
  });

  document.getElementById("pad").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-digit]");
    if (!btn) return;
    enterDigit(btn.getAttribute("data-digit"));
  });
  document.getElementById("code-back").addEventListener("click", function () {
    codeBuf = codeBuf.slice(0, -1);
    paintDots();
  });
  document.getElementById("code-cancel").addEventListener("click", closePasscode);
  document.getElementById("parent-done").addEventListener("click", closeParent);
  document.getElementById("parent").addEventListener("click", function (e) {
    if (e.target.id === "parent") closeParent();
  });
  document.getElementById("passcode").addEventListener("click", function (e) {
    if (e.target.id === "passcode") closePasscode();
  });
  document.getElementById("clear-btn").addEventListener("click", function () {
    document.getElementById("clear-btn").classList.add("hidden");
    document.getElementById("confirm").classList.remove("hidden");
  });
  document.getElementById("clear-no").addEventListener("click", function () {
    document.getElementById("confirm").classList.add("hidden");
    document.getElementById("clear-btn").classList.remove("hidden");
  });
  document.getElementById("clear-yes").addEventListener("click", clearConversation);

  document.addEventListener("keydown", function (e) {
    var passOpen = !document.getElementById("passcode").classList.contains("hidden");
    var parentOpen = !document.getElementById("parent").classList.contains("hidden");
    if (passOpen) {
      if (/^\d$/.test(e.key)) enterDigit(e.key);
      else if (e.key === "Backspace") {
        codeBuf = codeBuf.slice(0, -1);
        paintDots();
      } else if (e.key === "Escape") closePasscode();
    } else if (parentOpen && e.key === "Escape") closeParent();
  });

  makeSnow();
  syncSend();
  boot();

  window.Santa = {
    freshState: freshState,
    detectWho: detectWho,
    detectVerdict: detectVerdict,
    extractNiceThing: extractNiceThing,
    parseWishes: parseWishes,
    isWishDecline: isWishDecline,
    detectReindeer: detectReindeer,
    daysUntilChristmas: daysUntilChristmas,
    christmasCopy: christmasCopy,
    typingDelay: typingDelay,
    rawDelay: rawDelay,
    idle: function () {
      return ready && !pumping && queue.length === 0 && !document.getElementById("typing-row");
    },
    replyLines: replyLines,
    reduce: reduce,
    getState: function () { return state; },
    KEY: KEY
  };
})();
</script>
</body>
</html>
